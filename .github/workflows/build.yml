name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Télécharger le projet
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Installer Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Installer les dépendances Linux
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake

      # 5. Installer Buildozer et Cython
      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer
          python -m pip install "Cython==0.29.36"

      # 6. Vérifier / corriger automatiquement buildozer.spec
      - name: Configure Buildozer
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERREUR : buildozer.spec est introuvable."
            exit 1
          fi

          sed -i \
            's/^# *android.accept_sdk_license *= *.*/android.accept_sdk_license = True/' \
            buildozer.spec

          sed -i \
            's/^android.accept_sdk_license *= *.*/android.accept_sdk_license = True/' \
            buildozer.spec

          sed -i \
            's/^# *android.skip_update *= *.*/android.skip_update = False/' \
            buildozer.spec

          sed -i \
            's/^android.skip_update *= *.*/android.skip_update = False/' \
            buildozer.spec

          if ! grep -q '^android.accept_sdk_license *= *True' buildozer.spec; then
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

          echo "===== Configuration Buildozer ====="
          grep -E 'android.accept_sdk_license|android.skip_update' buildozer.spec || true

      # 7. Nettoyer un ancien environnement Buildozer
      - name: Clean Buildozer cache
        run: |
          buildozer android clean || true
          rm -rf .buildozer

      # 8. Construire l'APK
      - name: Build Android APK
        run: |
          yes | buildozer -v android debug

      # 9. Sauvegarder l'APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error
